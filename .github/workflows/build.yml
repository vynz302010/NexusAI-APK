name: Build NexusAI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore app/keystore.jks \
            -alias nexusai \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass nexusai2024 \
            -keypass nexusai2024 \
            -dname "CN=VynzzDEV, OU=NexusAI, O=VynzzDEV, L=ID, S=ID, C=ID"

      - name: Build Release APK
        env:
          KEYSTORE_PATH: keystore.jks
          KEY_STORE_PASSWORD: nexusai2024
          KEY_ALIAS: nexusai
          KEY_PASSWORD: nexusai2024
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusAI-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: NexusAI v1.0.${{ github.run_number }}
          files: app/build/outputs/apk/release/app-release.apk
          body: |
            NexusAI Android App - Build #${{ github.run_number }}
            Auto-built by GitHub Actions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
